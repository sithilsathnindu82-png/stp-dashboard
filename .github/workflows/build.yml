name: Build STP DASHBOARD APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build
        run: |
          cordova create app_build com.stpdashboard.app "STP DASHBOARD"
          rm -rf app_build/www/*
          cp -r index.html app_build/www/
          cp -r css app_build/www/ 2>/dev/null || true
          cp -r js app_build/www/ 2>/dev/null || true
          cp -r assets app_build/www/ 2>/dev/null || true
          cd app_build
          cordova platform add android
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STP_DASHBOARD_APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
